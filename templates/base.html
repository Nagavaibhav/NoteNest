<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}NoteNest{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>{% if session.get('user_id') %}<header class="topbar"><a class="brand" href="{{ url_for('dashboard') }}">NoteNest</a><nav><a href="{{ url_for('dashboard') }}">Notes</a><a href="{{ url_for('upload_note') }}">Upload</a><a href="{{ url_for('import_notes') }}">Import</a><a href="{{ url_for('export_notes') }}">Export</a><form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Sign out</button></form></nav></header>{% endif %}<main class="{% block main_class %}page{% endblock %}">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category, message in messages %}<p class="message {{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='app.js') }}"></script></body>
</html>
