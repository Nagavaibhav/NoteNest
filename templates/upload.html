{% extends 'base.html' %}
{% block title %}Upload note | NoteNest{% endblock %}
{% block content %}<a class="plain-link" href="{{ url_for('dashboard') }}">Back to notes</a><section class="single-page"><h1>Upload a note</h1><p>Add a module if you want to group notes by unit or chapter.</p><form method="post" enctype="multipart/form-data" class="form upload-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>File<input name="file" id="file" type="file" accept=".pdf,.ppt,.pptx,.docx,.txt" required></label><label>Module or unit<input name="module" maxlength="60" placeholder="Example: Module 2"></label><p id="file-name" class="file-help">PDF, PPT/PPTX, DOCX or TXT. Maximum size: 12 MB.</p><button type="submit">Upload and organize</button></form></section>{% endblock %}
